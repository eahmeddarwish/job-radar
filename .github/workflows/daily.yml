name: job radar

on:
  schedule:
    - cron: "5 * * * *"      # hourly, at five past — GitHub's scheduler is busiest on the hour
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore the seen-jobs database
        uses: actions/cache@v4
        with:
          path: radar.db
          key: radar-db-${{ github.run_id }}
          restore-keys: radar-db-

      - name: Scan
        id: scan
        run: python run.py scan

      - name: Push the results to the dashboard
        env:
          CAREER_API_URL: ${{ secrets.CAREER_API_URL }}
          CAREER_SYNC_SECRET: ${{ secrets.CAREER_SYNC_SECRET }}
        run: python sync.py

      - name: Raise an issue only when something new turned up
        if: steps.scan.outputs.new_matches != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('reports/latest.md', 'utf8');
            const when = new Date().toISOString().slice(0, 16).replace('T', ' ');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Job Radar — ${when} · ${{ steps.scan.outputs.new_matches }} new`,
              body,
            });

      - name: Commit the report and the database
        run: |
          git config user.name  "job-radar"
          git config user.email "actions@github.com"
          git add reports radar.db || true
          git diff --staged --quiet || git commit -m "radar: $(date -u +%FT%H:%M) [skip ci]"
          git push || true
